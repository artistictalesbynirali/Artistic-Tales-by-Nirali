      .grain-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;

        opacity: 0.08;
        pointer-events: none;
        z-index: 999;
        mix-blend-mode: overlay;
      }

      .brush-stroke {
        clip-path: polygon(

          2% 75%, 5% 45%

          2% 55%, 5% 25%

      }
      ::-webkit-scrollbar-track {
